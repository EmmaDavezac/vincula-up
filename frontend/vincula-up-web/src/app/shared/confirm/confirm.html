<ng-template #confirmDialog>
	<div
		class="vu-confirm__dialog"
		[class.vu-confirm__dialog--danger]="peligro()"
		[class.vu-confirm__dialog--cancel-primary]="cancelarPrimario()"
	>
		<header mat-dialog-title class="vu-confirm__head">
			<span class="vu-confirm__icon" [class.vu-confirm__icon--danger]="peligro()">
				<vu-icon [name]="icono()" [size]="20" />
			</span>
			<div>
				<h2 class="vu-confirm__title">{{ titulo() }}</h2>
				<p class="vu-confirm__message">{{ mensaje() }}</p>
			</div>
		</header>

		<div mat-dialog-content class="vu-confirm__content">
		@if (detalle()) {
			<p class="vu-confirm__detail">{{ detalle() }}</p>
		}
		</div>

		<footer mat-dialog-actions class="vu-confirm__actions">
			<button
				type="button"
				mat-button
				class="vu-btn vu-confirm__cancel"
				[class.vu-btn--outline]="!cancelarPrimario()"
				[class.vu-btn--ink]="cancelarPrimario()"
				(click)="cancelar()"
				[disabled]="cargando()"
			>
				{{ textoCancelar() }}
			</button>
			<button
				type="button"
				mat-flat-button
				class="vu-btn vu-confirm__accept"
				[class.vu-btn--danger]="peligro() && !cancelarPrimario()"
				[class.vu-btn--outline]="peligro() && cancelarPrimario()"
				[class.vu-btn--ink]="!peligro()"
				(click)="confirmar()"
				[disabled]="cargando()"
			>
				{{ cargando() ? 'Trabajando...' : textoConfirmar() }}
			</button>
		</footer>
	</div>
</ng-template>
