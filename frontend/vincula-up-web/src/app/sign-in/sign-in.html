<section class="auth-page">
  <div class="auth-copy">
    <p class="eyebrow">Acceso Vincula-UP</p>
    <h1>Entrá a tu espacio de la red.</h1>
    <p>Iniciá sesión con Keycloak para acceder a la plataforma.</p>
  </div>
  <div class="role-list">
    @if (loginError()) {
      <p class="error-message">{{ loginError() }}</p>
    }
    <p class="role-label">Autenticación real</p>
    <button type="button" (click)="loginWithKeycloak()"><strong>Iniciar sesión con Keycloak</strong><span>Entrar con usuario y contraseña</span></button>
  </div>
</section>
