<!--
Una sola navegación para todo el sitio: la barra superior va siempre (también
dentro del panel de administración) y en móvil se suma la barra inferior
para pasar entre secciones. El footer del sitio no se muestra en el panel.
-->
<app-navbar />
<main>
	<router-outlet />
</main>
@if (!enPanelAdmin()) {
	<app-footer />
}
<vu-tabbar />

<!--
Aceptación de los términos y condiciones. Va al final y por encima de todo: es
una capa sobre la aplicación, no una pantalla más, para que no se pueda esquivar
escribiendo una URL.
-->
<app-terminos-modal />

<!--
Animación de inicio de sesión y verificación de credenciales de acceso.
Disimula las consultas iniciales y evita el parpadeo de modales o pantallas.
-->
<app-auth-loading />
