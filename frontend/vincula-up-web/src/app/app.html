<!--
Una sola navegación para todo el sitio: la barra superior va siempre (también
dentro del panel de administración) y en móvil se suma la barra inferior
para pasar entre secciones. El footer del sitio no se muestra en el panel.
-->
@if (auth.cerrandoSesion()) {
	<app-loading-screen mensaje="Cerrando sesión..." />
} @else if (auth.loginRedirecting()) {
	<app-loading-screen mensaje="Conectando con el inicio de sesión..." />
} @else if (auth.verificandoCuenta()) {
	<app-loading-screen
		mensaje="Iniciando sesión..."
		[error]="auth.errorConsultaCuenta() ? 'No pudimos verificar tu cuenta.' : ''"
		(reintentarClick)="auth.reintentarConsultaCuenta()"
	/>
} @else {
	<app-navbar />
	<main>
		<router-outlet />
	</main>
	@if (enPanelAdmin()) {
		<app-admin-footer />
	} @else {
		<app-footer />
	}
	<vu-tabbar />

	<!-- El modal solo se monta tras verificar la aceptación en el backend. -->
	<app-terminos-modal />
}
