

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: vinculaup-keycloak
    depends_on:
      - postgres
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      KC_DB_USERNAME: ${DATABASE_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  postgres:
    image: postgres:16
    container_name: vinculaup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinculaup}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ms-usuarios:
    build:
      context: ./backend/ms-usuarios
    container_name: vinculaup-ms-usuarios
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "8081:8081"

  ms-profesionales:
    build:
      context: ./backend/ms-profesionales
    container_name: vinculaup-ms-profesionales
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "8082:8082"

  ms-solicitudes:
    build:
      context: ./backend/ms-solicitudes
    container_name: vinculaup-ms-solicitudes
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8083
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      PROFESIONALES_URL: http://ms-profesionales:8082
    ports:
      - "8083:8083"

  bff-web:
    build:
      context: ./backend/bff-web
    container_name: vinculaup-bff-web
    depends_on:
      - ms-usuarios
      - ms-profesionales
      - ms-solicitudes
    restart: unless-stopped
    environment:
      PORT: 9001
      USUARIOS_URL: http://ms-usuarios:8081
      PROFESIONALES_URL: http://ms-profesionales:8082
      SOLICITUDES_URL: http://ms-solicitudes:8083
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/vincula-up}
    ports:
      - "9001:9001"

  nginx:
    image: nginx:1.27-alpine
    container_name: vinculaup-nginx
    depends_on:
      - bff-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/vincula-up-web/dist/vincula-up-web/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: vinculaup-pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vincula-up.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
