version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: vinculaup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vinculaup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ms-usuarios:
    build:
      context: ./backend/ms-usuarios
    container_name: vinculaup-ms-usuarios
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/vinculaup
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JPA_DDL_AUTO: update
    ports:
      - "8081:8081"

  ms-profesionales:
    build:
      context: ./backend/ms-profesionales
    container_name: vinculaup-ms-profesionales
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/vinculaup
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JPA_DDL_AUTO: update
    ports:
      - "8082:8082"

  ms-solicitudes:
    build:
      context: ./backend/ms-solicitudes
    container_name: vinculaup-ms-solicitudes
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      PORT: 8083
      DATABASE_URL: jdbc:postgresql://postgres:5432/vinculaup
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JPA_DDL_AUTO: update
      PROFESIONALES_URL: http://ms-profesionales:8082
    ports:
      - "8083:8083"

  bff-web:
    build:
      context: ./backend/bff-web
    container_name: vinculaup-bff-web
    depends_on:
      - ms-usuarios
      - ms-profesionales
      - ms-solicitudes
    restart: unless-stopped
    environment:
      PORT: 9001
      USUARIOS_URL: http://ms-usuarios:8081
      PROFESIONALES_URL: http://ms-profesionales:8082
      SOLICITUDES_URL: http://ms-solicitudes:8083
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/vincula-up
    ports:
      - "9001:9001"

volumes:
  postgres_data:
