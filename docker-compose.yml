# =============================================================================
#  Stack completo de Vincula-UP: 8 servicios, todos en una red de Docker
# =============================================================================
#
#  LEVANTAR
#    cp .env.example .env   (Linux)   |   Copy-Item .env.example .env (Windows)
#    docker compose up --build
#    docker compose down -v            # borra tambien los volumenes (datos)
#
#  ── MAPA DE PUERTOS Y URLs ──────────────────────────────────────────────────
#  ┌──────────────────┬──────────┬───────────────────────────────────┬─────────────────┐
#  │ Servicio         │ Puerto   │ URL desde el navegador            │ Qué es          │
#  ├──────────────────┼──────────┼───────────────────────────────────┼─────────────────┤
#  │ nginx            │ 80, 443  │ https://vincula-up.local          │ La aplicación   │
#  │ bff-web          │ 9001     │ http://localhost:9001/api/...     │ La API          │
#  │ keycloak         │ 8080     │ http://localhost:8080            │ Login + consola │
#  │ pgadmin          │ 5050     │ http://localhost:5050            │ Consola de la BD│
#  │ postgres         │ 5432     │ (no se abre en el navegador)     │ Base de datos   │
#  │ ms-usuarios      │ 8081     │ (solo 127.0.0.1, sin interfaz)  │ Cuentas         │
#  │ ms-profesionales │ 8082     │ (solo 127.0.0.1, sin interfaz)  │ Padrón          │
#  │ ms-solicitudes   │ 8083     │ (solo 127.0.0.1, sin interfaz)  │ Solicitudes     │
#  └──────────────────┴──────────┴───────────────────────────────────┴─────────────────┘
#
#  POR QUÉ LOS ms-* ESTÁN LIMITADOS A 127.0.0.1
#  Los tres microservicios de dominio NO validan tokens ni aplican permisos: son
#  internos. Publicar sus puertos en toda la red dejaría la base de datos
#  accesible sin autenticación. Todo el tráfico del navegador entra por nginx y
#  pasa por el bff-web, que sí valida el token de Keycloak. Por eso sus puertos
#  se publican solo en el loopback: sirven para depurar desde la máquina, pero no
#  son alcanzables desde la red.
#
#  ── CONVENCIONES ───────────────────────────────────────────────────────────
#  - container_name: todos empiezan con `vinculaup-` para no chocar con otras
#    instalaciones de Docker de la misma máquina.
#  - depends_on + condition: service_healthy: espera a que el servicio anterior
#    esté realmente listo, no solo arrancado. Sin esto el BFF llama a un
#    microservicio que todavía no escucha y devuelve 502.
#  - Los ${VARIABLE:-valor} leen del .env y usan el valor de la derecha si no
#    está definido. Todas están documentadas en .env.example.
#  - Las fotos de perfil NO las sirve nginx: las entrega el BFF por
#    /api/usuarios/{id}/foto, que exige sesión y aplica un control de visibilidad
#    por rol. El volumen fotos_data solo lo monta el BFF, que las escribe y lee.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: vinculaup-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      KC_DB_USERNAME: ${DATABASE_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-vincula-up.local}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Necesario para que Keycloak sepa que está detrás de un proxy HTTPS
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      # SMTP del realm (recupero de contraseña). Como queda configurado de
      # verdad: lo aplica scripts/*/keycloak-bootstrap.* leyendo KEYCLOAK_SMTP_*
      # del .env. El import del realm NO resuelve sus placeholders ${env.*}
      # (ver keycloak/import/README.md), así que estas variables, por sí solas,
      # no configuran el SMTP. Se pasan igual, con el nombre que usan esos
      # placeholders, para que el contenedor ya tenga los valores el día que el
      # import los pueda resolver. Sin KEYCLOAK_SMTP_PASSWORD el reseteo queda
      # habilitado pero Keycloak no puede enviar el email.
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-smtp.gmail.com}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-true}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Vincula-UP}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  postgres:
    image: postgres:16
    container_name: vinculaup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinculaup}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vinculaup"]
      interval: 4s
      timeout: 5s
      retries: 5

  ms-usuarios:
    build:
      context: ./backend/ms-usuarios
    container_name: vinculaup-ms-usuarios
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Siembra los datos de demo (especialidades, profesionales, solicitudes).
      # Con false la base arranca vacia.
      SEMBRAR_DEMO: ${SEMBRAR_DEMO:-true}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
    ports:
      # Sólo accesible desde el host: ms-usuarios no expone autenticación propia,
      # así que no debe quedar publicado en la red. Toda entrada pasa por nginx/BFF.
      - "127.0.0.1:8081:8081"
    # La JVM tarda ~1 minuto en levantar: sin healthcheck el BFF/nginx arrancan antes
    # y devuelven 502 "Connection refused" durante ese lapso.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 90s

  ms-profesionales:
    build:
      context: ./backend/ms-profesionales
    container_name: vinculaup-ms-profesionales
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Siembra los datos de demo (especialidades, profesionales, solicitudes).
      # Con false la base arranca vacia.
      SEMBRAR_DEMO: ${SEMBRAR_DEMO:-true}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      UBICACIONES_CLAVE: ${UBICACIONES_CLAVE:-}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 90s

  ms-solicitudes:
    build:
      context: ./backend/ms-solicitudes
    container_name: vinculaup-ms-solicitudes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: 8083
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vinculaup}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Siembra los datos de demo (especialidades, profesionales, solicitudes).
      # Con false la base arranca vacia.
      SEMBRAR_DEMO: ${SEMBRAR_DEMO:-true}
      PROFESIONALES_URL: http://ms-profesionales:8082
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      # Misma clave que en ms-profesionales: si difieren, cada servicio descifra
      # lo que el otro cifró y las coordenadas quedan ilegibles.
      UBICACIONES_CLAVE: ${UBICACIONES_CLAVE:-}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 90s

  bff-web:
    build:
      context: ./backend/bff-web
    container_name: vinculaup-bff-web
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-profesionales:
        condition: service_healthy
      ms-solicitudes:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    environment:
      PORT: 9001
      USUARIOS_URL: http://ms-usuarios:8081
      PROFESIONALES_URL: http://ms-profesionales:8082
      SOLICITUDES_URL: http://ms-solicitudes:8083
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/vincula-up}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/vincula-up/protocol/openid-connect/certs}
      # Client de servicio para promover a PROFESIONAL al profesional invitado
      # que se auto-registra con el email cargado por el administrador.
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-vincula-up}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-vincula-up-admin}
      # Este es el valor que ve el BFF. El otro lado (Keycloak) lo setea el
      # bootstrap a partir del MISMO valor del .env: el import del realm no lo
      # lee. El default de abajo es el secreto de demo, que es PÚBLICO, y está
      # para que `docker compose up` funcione recién clonado. Rotarlo antes de
      # exponer el stack (ver MANUAL.md, "El secreto del client de servicio").
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-vincula-up-admin-secret}
      # Almacenamiento de fotos. El BFF sube el archivo al volumen y devuelve
      # solo su clave; los servicios de dominio nunca ven el archivo. Las fotos
      # se sirven por GET /api/usuarios/{id}/foto, con sesión y control de rol.
      STORAGE_LOCAL_DIR: /data/fotos
      STORAGE_PREFIX: ${STORAGE_PREFIX:-perfiles}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-2097152}
      # Avisos por correo (mismo SMTP que usa Keycloak). Sin password, el aviso
      # de prerregistro no sale pero el alta del profesional se guarda igual.
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-true}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Vincula-UP}
      # Enlace que va en el correo para que el profesional active su perfil.
      APP_URL: ${APP_URL:-https://vincula-up.local}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
    volumes:
      - fotos_data:/data/fotos
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://localhost:9001/actuator/health"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: vinculaup-nginx
    depends_on:
      bff-web:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # OJO: el volumen fotos_data NO se monta acá a propósito. nginx no debe
      # servir las fotos como estático: sería una URL pública para cualquier
      # foto, sin sesión ni control de rol. Las entrega el BFF, que sí valida.

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: vinculaup-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # El .local no lo acepta pgAdmin 8.12: exige un TLD real (com, net, org).
      # Es solo la credencial de la consola web de pgAdmin, no toca la app.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vincula-up.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  # Fotos de perfil. Solo lo monta el BFF, que las escribe al subirlas y las lee
  # cuando alguien pide GET /api/usuarios/{id}/foto. nginx NO lo monta a
  # propósito: si lo sirviera como estático, cualquiera con la URL vería la foto
  # de cualquiera, sin sesión y sin importar el rol.
  fotos_data:
