spring.application.name=ms-profesionales
server.port=${PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:profesionales;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Cifrado AES-256-GCM de coordenadas en reposo. Clave de 32 bytes en Base64:
#   openssl rand -base64 32
# Sin la variable el servicio arranca igual, pero guarda sin cifrar.
ubicaciones.clave=${UBICACIONES_CLAVE:}
