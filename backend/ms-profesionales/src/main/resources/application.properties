spring.application.name=ms-profesionales
server.port=${PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:profesionales;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Validación JWT de Keycloak (oauth2-resource-server): este microservicio valida
# el token por su cuenta, no confía en el perímetro del BFF.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vincula-up}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/vincula-up/protocol/openid-connect/certs}

# Cifrado AES-256-GCM de coordenadas en reposo. Clave de 32 bytes en Base64:
#   openssl rand -base64 32
# Sin la variable el servicio arranca igual, pero guarda sin cifrar.
ubicaciones.clave=${UBICACIONES_CLAVE:}

# Siembra de datos de demo (SEMBRAR_DEMO=true). Con false, la base queda vacia:
# no hay especialidades, profesionales ni solicitudes de ejemplo.
sembrar.demo=${SEMBRAR_DEMO:true}
