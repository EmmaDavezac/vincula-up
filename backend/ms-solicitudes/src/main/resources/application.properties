spring.application.name=ms-solicitudes
server.port=${PORT:8083}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:solicitudes;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

profesionales.url=${PROFESIONALES_URL:http://localhost:8082}

# Cifrado AES-256-GCM de coordenadas en reposo. Clave de 32 bytes en Base64:
#   openssl rand -base64 32
# Sin la variable el servicio arranca igual, pero guarda sin cifrar.
ubicaciones.clave=${UBICACIONES_CLAVE:}

# Siembra de datos de demo (SEMBRAR_DEMO=true). Con false, la base queda vacia:
# no hay especialidades, profesionales ni solicitudes de ejemplo.
sembrar.demo=${SEMBRAR_DEMO:true}
