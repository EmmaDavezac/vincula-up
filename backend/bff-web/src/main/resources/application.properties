spring.application.name=bff-web
server.port=${PORT:9001}

usuarios.url=${USUARIOS_URL:http://localhost:8081}
profesionales.url=${PROFESIONALES_URL:http://localhost:8082}
solicitudes.url=${SOLICITUDES_URL:http://localhost:8083}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vincula-up}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/vincula-up/protocol/openid-connect/certs}

# Client de servicio (confidencial) usado para promover el rol PROFESIONAL en
# Keycloak cuando un profesional invitado se auto-registra con el email que el
# administrador cargó. Sin secretos la promoción queda deshabilitada y el login
# sigue funcionando (el rol se aplicaría a mano en Keycloak).
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:vincula-up}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Almacenamiento de fotos. Un solo backend, en disco: el BFF escribe en el volumen
# STORAGE_LOCAL_DIR y lo lee cuando alguien pide la foto. No hay bucket ni servicio
# de objetos: no se usa.
# En la base se guarda solo la CLAVE del archivo (perfiles/<uuid>.jpg), nunca una
# URL. Las fotos son privadas: se sirven por GET /api/usuarios/{id}/foto, que valida
# sesión y rol antes de devolver los bytes.
storage.local.dir=${STORAGE_LOCAL_DIR:/data/fotos}
storage.prefix=${STORAGE_PREFIX:perfiles}
storage.max-bytes=${STORAGE_MAX_BYTES:2097152}

# Cifrado AES-256-GCM de coordenadas (compartido por ms-solicitudes y
# ms-profesionales). Debe ser una clave de 32 bytes en Base64: generarla con
#   openssl rand -base64 32
ubicaciones.clave=${UBICACIONES_CLAVE:}

# ── Avisos por correo ────────────────────────────────────────────────────────
# Reutiliza el mismo SMTP que ya usa Keycloak para el reseteo de contraseña, así
# que no hay credenciales duplicadas en el .env. Sin SMTP_PASSWORD configurado
# el envío queda deshabilitado y la aplicación arranca igual: el prerregistro se
# guarda, pero no llega el aviso (queda registrado en el log).
spring.mail.host=${KEYCLOAK_SMTP_HOST:}
spring.mail.port=${KEYCLOAK_SMTP_PORT:587}
spring.mail.username=${KEYCLOAK_SMTP_USER:}
spring.mail.password=${KEYCLOAK_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KEYCLOAK_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KEYCLOAK_SMTP_STARTTLS:true}
# Remitente por defecto; el aviso de prerregistro usa la variante "nombre <correo>"
# para que en la bandeja del profesional se vea el nombre de la organización.
mail.from=${KEYCLOAK_SMTP_FROM:${spring.mail.username}}
mail.from-display-name=${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:Vincula-UP}
# URL pública de la app: se usa en el enlace del mail para que el profesional
# entre directo a activar su perfil.
mail.app-url=${APP_URL:https://vincula-up.local}
