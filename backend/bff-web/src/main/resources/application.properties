spring.application.name=bff-web
server.port=${PORT:9001}

usuarios.url=${USUARIOS_URL:http://localhost:8081}
profesionales.url=${PROFESIONALES_URL:http://localhost:8082}
solicitudes.url=${SOLICITUDES_URL:http://localhost:8083}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vincula-up}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/vincula-up/protocol/openid-connect/certs}

# Client de servicio (confidencial) usado para promover el rol PROFESIONAL en
# Keycloak cuando un profesional invitado se auto-registra con el email que el
# administrador cargó. Sin secretos la promoción queda deshabilitada y el login
# sigue funcionando (el rol se aplicaría a mano en Keycloak).
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:vincula-up}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
