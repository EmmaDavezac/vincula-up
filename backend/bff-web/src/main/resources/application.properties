spring.application.name=bff-web
server.port=${PORT:9001}

usuarios.url=${USUARIOS_URL:http://localhost:8081}
profesionales.url=${PROFESIONALES_URL:http://localhost:8082}
solicitudes.url=${SOLICITUDES_URL:http://localhost:8083}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vincula-up}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/vincula-up/protocol/openid-connect/certs}

# Client de servicio (confidencial) usado para promover el rol PROFESIONAL en
# Keycloak cuando un profesional invitado se auto-registra con el email que el
# administrador cargó. Sin secretos la promoción queda deshabilitada y el login
# sigue funcionando (el rol se aplicaría a mano en Keycloak).
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:vincula-up}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Almacenamiento de fotos. Hay dos implementaciones de la misma interfaz y se
# elige una con storage.tipo:
#   local (default) -> disco, en un volumen. No necesita ningún servicio extra.
#   s3              -> MinIO o Cloudflare R2, vía API compatible con S3.
# En los dos casos la base guarda solo la URL, nunca el archivo.
storage.tipo=${STORAGE_TIPO:local}
# Solo para storage.tipo=local: directorio del volumen.
storage.local.dir=${STORAGE_LOCAL_DIR:/data/fotos}

# Solo para storage.tipo=s3. STORAGE_PUBLIC_URL es la base con la que se arman
# las URLs públicas: dentro de Docker el navegador no resuelve `minio`, así que
# se usa localhost.
storage.endpoint=${STORAGE_ENDPOINT:http://minio:9000}
storage.access-key=${STORAGE_ACCESS_KEY:vinculaminio}
storage.secret-key=${STORAGE_SECRET_KEY:vinculaminio123}
storage.bucket=${STORAGE_BUCKET:vincula-up-media}
# Con local, la URL pública debe apuntar a donde nginx sirve el volumen (/fotos/).
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:9000/vincula-up-media}
storage.prefix=${STORAGE_PREFIX:perfiles}
storage.max-bytes=${STORAGE_MAX_BYTES:2097152}

# Cifrado AES-256-GCM de coordenadas (compartido por ms-solicitudes y
# ms-profesionales). Debe ser una clave de 32 bytes en Base64: generarla con
#   openssl rand -base64 32
ubicaciones.clave=${UBICACIONES_CLAVE:}
