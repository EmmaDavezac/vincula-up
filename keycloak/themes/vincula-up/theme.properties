# Tema de correo de Vincula-UP.
#
# Extiende `keycloak` y no `base` a propósito: así se heredan los archivos .ftl
# de la base (password-reset.ftl, email-verification.ftl, los de texto plano, etc.)
# y acá solo se define la marca. La única plantilla que se sobreescribe es
# html/template.ftl, que es la que arma el contenedor del correo; los textos
# están en messages/messages_es.properties.
#
# Se monta en el contenedor con docker-compose:
#   ./keycloak/themes/vincula-up → /opt/keycloak/themes/vincula-up:ro
#
# Y se activa con emailTheme=vincula-up (lo aplica keycloak-bootstrap.*, igual
# que el SMTP: el import del realm solo corre en la primera creación).

# Propiedades del tema raíz.
parent=keycloak
import=common/keycloak