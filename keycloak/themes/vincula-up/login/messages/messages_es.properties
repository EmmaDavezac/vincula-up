# ─────────────────────────────────────────────────────────────────────────────
# Textos de las pantallas de acceso de Vincula-UP (es).
#
# ── Por qué este archivo ─────────────────────────────────────────────────────
# El login de Keycloak viene en español "de fábrica", pero con el tono de la
# herramienta: "Acceder a tu cuenta", "¿Has olvidado tu contraseña?",
# "¿Usuario nuevo?". La aplicación usa voseo rioplatense ("Ingresá", "Iniciá
# sesión", "¿Perdiste tu contraseña?"), así que estas pantallas se adecuaban a la
# aplicación. Acá se corrigen las que se ven en el flujo de acceso.
#
# ── Por qué solo algunas claves ─────────────────────────────────────────────
# El bundle del tema hijo se completa con el del padre: lo que NO está acá lo
# resuelve `base` de Keycloak, con su traducción oficial al español. Por eso
# este archivo no copia el bundle entero: si se copiara, cada palabra nueva de
# una actualización de Keycloak quedaría congelada en la copia. Solo se pisan
# las claves cuya redacción importa para la marca.
# ─────────────────────────────────────────────────────────────────────────────

