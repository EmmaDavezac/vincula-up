# ─────────────────────────────────────────────────────────────────────────────
# Textos de las pantallas de acceso de Vincula-UP (es).
#
# ── Por qué este archivo ─────────────────────────────────────────────────────
# El login de Keycloak viene en español "de fábrica", pero con el tono de la
# herramienta: "Acceder a tu cuenta", "¿Has olvidado tu contraseña?",
# "¿Usuario nuevo?". La aplicación usa voseo rioplatense ("Ingresá", "Iniciá
# sesión", "¿Perdiste tu contraseña?"), así que estas pantallas se قلaban de la
# aplicación. Acá se corrigen las que se ven en el flujo de acceso.
#
# ── Por qué solo algunas claves ─────────────────────────────────────────────
# El bundle del tema hijo se completa con el del padre: lo que NO está acá lo
# resuelve `base` de Keycloak, con su traducción oficial al español. Por eso
# este archivo no copia el bundle entero: si se copiara, cada palabra nueva de
# una actualización de Keycloak quedaría congelada en la copia. Solo se pisan
# las claves cuya redacción importa para la marca.
#
# ── Para agregar un texto ───────────────────────────────────────────────────
# Buscá la clave en `theme/base/login/messages/messages_es.properties` del JAR
# (`keycloak-themes-*.jar`) y ponela acá abajo con la redacción de la app.
#
# ── Reglas de escritura ─────────────────────────────────────────────────────
# · Los textos con apostrofe (' ') hay que escaparlos duplicando la comilla:
#   es MessageFormat, no FreeMarker. Ninguno de los de abajo tiene apostrofe.
# · `${...}` NO se expande acá: este archivo es un bundle de mensajes, no una
#   plantilla. Los valores que necesite algo de la página van en el
#   `template.ftl` o en el `footer.ftl`.
# ─────────────────────────────────────────────────────────────────────────────


# ── Texts propios de Vincula-UP ───────────────────────────────────────────────

# Título de la pestaña. Lo usa template.ftl en el <title>: sin esto salía
# "Inicia sesión en vincula-up", el nombre técnico del realm.
vinculaUpLoginTitle=Vincula-UP · Ingresá a tu cuenta

# Subtítulo de la cabecera, debajo del nombre de la marca.
vinculaUpTagline=Red técnica con respaldo universitario


# ── Pólvora y redemption ──────────────────────────────────────────────────────
# Los títulos de las pantallas del flujo. El de fábrica mezcla "Ha olvidado
# su contraseña" (usted) con el resto del texto en voseo.

doLogIn=Ingresar
doContinue=Continuar
doCancel=Cancelar
doSubmit=Enviar

emailForgotTitle=¿Olvidaste tu contraseña?
updatePasswordTitle=Definí tu nueva contraseña
loginProfileTitle=Completá los datos de tu cuenta
emailVerifyTitle=Confirmá tu correo
errorTitle=No pudimos continuar

# El rótulo del campo: la aplicación pide el correo, no un nombre de usuario
# (el realm tiene registrationEmailAsUsername en true).
email=Correo electrónico
password=Contraseña
passwordNew=Nueva contraseña

doForgotPassword=¿Olvidaste tu contraseña?
doTryAnotherWay=Usar otro método para ingresar

# El bloque de abajo de la pantalla de ingreso. El de fábrica pregunta "¿Usuario
# nuevo?", que suena a registro genérico de un sistema.
noAccount=¿Todavía no tenés cuenta?
doRegister=Registrate


# ── Avisos de error ──────────────────────────────────────────────────────────
# Los mensajes de error los arma el servidor con el código del error y el texto
# del bundle. Estos son los de los casos que la persona ve seguido.

invalidUserMessageError=No existe una cuenta con ese correo.
invalidUserPasswordMessageError=El correo o la contraseña no coinciden.
# E-mail sin confirmar: con verifyEmail en true es el error más común, porque
# llega después de registrarse y el correo de verificación a veces se cuela en
# spam. Decirlo explícito evita que repita el registro.
emailNotVerifiedMessage=Confirmá tu correo con el enlace que te enviamos antes de ingresar.
accountDisabledMessage=Tu cuenta está suspendida. Escribinos y lo vemos.
credentialsExpiredMessage=Tu contraseña expiró. Definí una nueva para seguir.
loginTimeout=La sesión tardó demasiado y se cerró. Volvé a ingresar.