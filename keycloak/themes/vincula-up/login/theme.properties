# ─────────────────────────────────────────────────────────────────────────────
# Tipo de tema `login` (pantallas de inicio de sesión de Vincula-UP).
#
# ESTE ARCHIVO SOLO APLICA AL TIPO `login`
# El `keycloak/themes/vincula-up/theme.properties` de la raíz declara
# `parent=keycloak` y aplica a todos los tipos del tema. Acá el tipo trae su
# propio `parent`, y el del tipo pisa al de la raíz: sin esto, el login se
# renderizaría con el tema clásico (PatternFly v4) en lugar del actual.
#
# ── Por qué `parent=keycloak.v2` ────────────────────────────────────────────
# Es el tema de fábrica que Keycloak 26.3.3 usa para el login (PatternFly v5),
# el mismo que está activo hoy sin este tema. Extenderlo en vez de `base` trae
# gratis los .ftl, el bundle de mensajes y los recursos (JS de contraseña,
# authChecker), y sobre todo el layout y los estados de foco, que están hechos
# con las clases pf-v5-*.
#
# ── Por qué `import=common/keycloak` ────────────────────────────────────────
# Aporta los `vendor/patternfly-v5/*.css` que el theme.properties del padre
# declara en `stylesCommon`. Sin este import, los estilos comunes no se
# encontrarían al resolverlos desde el tema hijo.
#
# ── Por qué se ENCADENA `css/styles.css` ────────────────────────────────────
# `styles` NO se acumula entre tema padre e hijo: el hijo pisa la propiedad
# entera. Si acá se escribiera solo `css/vincula-up.css`, se perdería el CSS
# base de keycloak.v2 (el que dibuja el contenedor, la cabecera y los estados de
# error). Por eso se repite el del padre y se suma el nuestro detrás, que gana
# por orden de cascada.
#
# Se monta en el contenedor con docker-compose:
#   ./keycloak/themes/vincula-up → /opt/keycloak/themes/vincula-up:ro
#
# Y se activa con loginTheme=vincula-up (lo aplica keycloak-bootstrap.*, igual
# que el SMTP y el tema de correo: el import del realm solo corre la primera
# vez que se crea el realm).
# ─────────────────────────────────────────────────────────────────────────────

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/vincula-up.css

# El fondo y la tarjeta los dibuja vincula-up.css. Estas cuatro variables son
# las que usa el CSS base para el fondo con el logo de Keycloak y para el color
# del borde superior de la tarjeta: se pisan acá para que ni una ni otra se
# queden con el color de fábrica.
keycloakCardTopColor=#e35f43
keycloakBgLogo=none
keycloakLogo=none
keycloakLogoText=none

# Valores que lee el pie de la pantalla (footer.ftl).
# Se editan acá: son la única parte del tema que cambia según el despliegue.
#   vinculaUpContacto  casilla que se muestra en el pie. OJO: esta NO se lee de
#                      acá sino de realm.attributes.vinculaUpContacto, que es lo
#                      que escribe keycloak-bootstrap.* desde KEYCLOAK_CONTACTO.
#                      Lo que sigue es el valor por defecto si el atributo no
#                      llegara al realm.
#   vinculaUpAppUrl    base pública de la app, para el enlace "Ir a Vincula-UP".
#                      Vacía = el enlace no se imprime.
vinculaUpContacto=vinculaup@gmail.com
vinculaUpAppUrl=https://vincula-up.local