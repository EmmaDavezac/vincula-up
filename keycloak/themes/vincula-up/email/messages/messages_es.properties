expiredActionTokenBody=El enlace que usaste en Vincula-UP ya venció y ya no sirve. Volvé a pedirlo desde la pantalla de ingreso y te mandamos uno nuevo.\n\nTu cuenta y tus datos están intactos.

expiredActionTokenBodyHtml=<p style="margin:0 0 16px 0;">El enlace que usaste en <strong>Vincula-UP</strong> ya venció y ya no sirve.</p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 16px 0;">Volvé a pedirlo desde la pantalla de ingreso y te mandamos uno nuevo. Tu cuenta y tus datos están intactos.</p>


