emailUpdateConfirmationSubject=Vincula-UP · Confirmá el cambio de correo

emailUpdateConfirmationBody=Para cambiar el correo de tu cuenta de Vincula-UP a {1}, abrí este enlace:\n\n{0}\n\nEl enlace vence en {3}.\n\nSi no pediste el cambio, ignorá este mensaje y tu correo sigue siendo el de siempre.

emailUpdateConfirmationBodyHtml=<p style="margin:0 0 16px 0;">Para cambiar el correo de tu cuenta de <strong>Vincula-UP</strong> a <strong>{1}</strong>, confirmá el cambio con el botón:</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;"><tr><td align="center" bgcolor="#e35f43" style="border-radius:6px;"><a href="{0}" style="display:inline-block; padding:13px 28px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:6px;">Confirmar el cambio</a></td></tr></table><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 20px 0;">El enlace vence en <strong>{3}</strong>.</p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0;">Si no pediste el cambio, ignorá este mensaje y tu correo sigue siendo el de siempre.</p>


# ── Bienvenida ────────────────────────────────────────────────────────────────

emailWelcomeSubject=Vincula-UP · Tu cuenta está lista

emailWelcomeBody=Hola,\n\nTu cuenta en Vincula-UP ya está creada. Podés entrar con tu correo y contraseña en la plataforma.\n\nSi necesitás ayuda, escribinos y te respondemos.

emailWelcomeBodyHtml=<p style="margin:0 0 16px 0;">Hola,</p><p style="margin:0 0 16px 0;">Tu cuenta en <strong>Vincula-UP</strong> ya está creada. Ya podés entrar con tu correo y tu contraseña.</p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0;">Si necesitás ayuda, respondé este correo y te acompañamos.</p>


