# ─────────────────────────────────────────────────────────────────────────────
# Textos de los correos de Vincula-UP (es).
#
# ── Por qué solo hay que tocar este archivo ────────────────────────────────────
# La cabecera, el ancho y el pie con la marca están en html/template.ftl y son
# los mismos para todos los correos. Acá va únicamente el texto del medio y el
# asunto, así que cambiar una palabra no rompe el diseño.
#
# ── Placeholders ─────────────────────────────────────────────────────────────
# Keycloak los pasa en este orden, y es el mismo para los tres correos:
#   {0} el enlace   {1} el vencimiento crudo (1800)   {2} el realm   {3} "30 minutos"
#
# ── Reglas de escritura ──────────────────────────────────────────────────────
# · El cuerpo se inserta con `?no_esc`: el HTML pasa crudo.
# · Las comillas simples se escapan duplicándolas (MessageFormat). Los textos
#   de abajo no usan apostrofes, así que no hay nada que escapar.
# · En los cuerpos de texto plano el salto de línea es `\n`.
# · Los colores van escritos en línea a propósito: el modo oscuro se resuelve
#   con las clases .vu-* que define template.ftl, y muchos clientes de correo
#   ignoran las hojas de estilo.
# ─────────────────────────────────────────────────────────────────────────────


# ── Recuperación de contraseña ────────────────────────────────────────────────

passwordResetSubject=Vincula-UP · Restablecé tu contraseña

passwordResetBody=Hola,\n\nAlguien pidió restablecer la contraseña de tu cuenta en Vincula-UP, la red técnica de oficios con respaldo de la Universidad Popular de Concepción del Uruguay.\n\nPara elegir una contraseña nueva, abrí este enlace:\n\n{0}\n\nEl enlace vence en {3}.\n\nSi no fuiste vos, no hagas nada: tu contraseña sigue siendo la misma y podés ignorar este mensaje.
passwordResetBodyHtml=<p style="margin:0 0 16px 0;">Hola,</p><p style="margin:0 0 16px 0;">Alguien pidió restablecer la contraseña de tu cuenta en <strong>Vincula-UP</strong>, la red técnica de oficios con respaldo de la Universidad Popular de Concepción del Uruguay.</p><p style="margin:0 0 20px 0;">Para elegir una contraseña nueva, usá el botón:</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;"><tr><td align="center" bgcolor="#e35f43" style="border-radius:6px;"><a href="{0}" style="display:inline-block; padding:13px 28px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:6px;">Restablecer mi contraseña</a></td></tr></table><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 20px 0;">El enlace vence en <strong>{3}</strong>. Después hay que pedir uno nuevo.</p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 20px 0;">Si el botón no funciona, copiá esta dirección en el navegador:<br><a href="{0}" style="color:#c34f3d; word-break:break-all;">{0}</a></p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="vu-dato" style="background-color:#f3f5f1; border-left:3px solid #e35f43; border-radius:0 4px 4px 0;"><tr><td style="padding:14px 16px;"><p class="vu-texto" style="color:#1e2926; font-size:13px; line-height:1.6; margin:0;"><strong>¿No fuiste vos?</strong> No hagas nada y este mensaje se descarta solo. Tu contraseña actual sigue siendo la misma.</p></td></tr></table>
# ── Verificación del correo ───────────────────────────────────────────────────
# El realm tiene verifyEmail: false, así que hoy este correo no sale. Queda
# listo por si algún día se activa (ver §16.2 de ESPECIFICACION.md).

emailVerificationSubject=Vincula-UP · Confirmá tu correo

emailVerificationBody=Hola,\n\nSe creó una cuenta en Vincula-UP con esta dirección de correo. Si fuiste vos, abrí este enlace para confirmarla:\n\n{0}\n\nEl enlace vence en {3}.\n\nSi no fuiste vos, ignorá este mensaje: la cuenta no se activa sola.

emailVerificationBodyHtml=<p style="margin:0 0 16px 0;">Hola,</p><p style="margin:0 0 16px 0;">Se creó una cuenta en <strong>Vincula-UP</strong> con esta dirección de correo. Si fuiste vos, confirmala con el botón:</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;"><tr><td align="center" bgcolor="#e35f43" style="border-radius:6px;"><a href="{0}" style="display:inline-block; padding:13px 28px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:6px;">Confirmar mi correo</a></td></tr></table><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 20px 0;">El enlace vence en <strong>{3}</strong>.</p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0 0 20px 0;">Si el botón no funciona, copiá esta dirección en el navegador:<br><a href="{0}" style="color:#c34f3d; word-break:break-all;">{0}</a></p><p class="vu-tenue" style="color:#67716c; font-size:13px; line-height:1.6; margin:0;">Si no fuiste vos, ignorá este mensaje: la cuenta no se activa sola.</p>

emailVerificationBodyCode=Confirmá tu correo en Vincula-UP con este código:\n\n{0}\n\nSi no fuiste vos, ignorá este mensaje.
