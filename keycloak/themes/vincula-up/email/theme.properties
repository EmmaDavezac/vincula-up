# Tipo de tema `email` (correos).
#
# `parent=keycloak`: hereda todas las plantillas .ftl de la base. El único
# archivo que se sobreescribe es html/template.ftl (la cabecera, el ancho y el
# pie con la marca). Los textos de cada correo están en
# messages/messages_es.properties.
parent=keycloak
import=common/keycloak

# Valores que lee el pie y la cabecera del correo (html/template.ftl).
# Se editan acá: son la única parte del tema que cambia según el despliegue.
#   vinculaUpContacto  casilla que se muestra en el pie ("escribinos a ...")
#   vinculaUpAppUrl    base pública de la app, para la imagen del logo.
# Si vinculaUpAppUrl queda vacía, el correo NO pide ninguna imagen y se ve
# igual: los clientes de correo bloquean las imágenes remotas por defecto.
vinculaUpContacto=vinculaup@gmail.com
vinculaUpAppUrl=https://vincula-up.local